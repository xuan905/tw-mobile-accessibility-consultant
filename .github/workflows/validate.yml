name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test, and measure coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate audit-case example
        run: python scripts/validate_audit_case.py examples/audit-case.example.json

      - name: Evaluate default accessibility rules
        run: python scripts/evaluate_audit_rules.py examples/audit-case.example.json

      - name: Generate Markdown audit report
        run: python scripts/generate_audit_report.py examples/audit-case.example.json --output /tmp/audit-case-report.md

      - name: Validate JSON documents
        run: |
          python -m json.tool schemas/audit-case.schema.json >/dev/null
          python -m json.tool examples/audit-case.example.json >/dev/null

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Generate coverage reports
        run: python scripts/generate_coverage_report.py --output-dir coverage-report

      - name: Package report smoke test
        run: |
          python scripts/package_report.py coverage-report/smoke-report.md \
            --html coverage-report/smoke-report.html \
            --pdf coverage-report/smoke-report.pdf

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ github.run_number }}
          path: coverage-report/
          if-no-files-found: error
          retention-days: 14

      - name: Validate required Skill files
        run: |
          test -s SKILL.md
          test -s references/taiwan-aa-checklist.md
          test -s references/platform-manual-testing.md
          test -s templates/accessibility-audit-report.md
          test -s schemas/audit-case.schema.json
          echo 'required Skill files are present'
