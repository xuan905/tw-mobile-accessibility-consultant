name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON and Skill files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate audit-case example
        run: python scripts/validate_audit_case.py examples/audit-case.example.json

      - name: Evaluate default accessibility rules
        run: python scripts/evaluate_audit_rules.py examples/audit-case.example.json

      - name: Validate JSON documents
        run: |
          python -m json.tool schemas/audit-case.schema.json >/dev/null
          python -m json.tool examples/audit-case.example.json >/dev/null

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Validate required Skill files
        run: |
          test -s SKILL.md
          test -s references/taiwan-aa-checklist.md
          test -s references/platform-manual-testing.md
          test -s templates/accessibility-audit-report.md
          test -s schemas/audit-case.schema.json
          echo 'required Skill files are present'
