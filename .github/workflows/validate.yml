name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON and Skill files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path('schemas/audit-case.schema.json'),
              Path('examples/audit-case.example.json'),
          ]
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid JSON: {path}')
          PY

      - name: Validate required Skill files
        run: |
          test -s SKILL.md
          test -s references/taiwan-aa-checklist.md
          test -s references/platform-manual-testing.md
          test -s templates/accessibility-audit-report.md
          test -s schemas/audit-case.schema.json
          echo 'required Skill files are present'
